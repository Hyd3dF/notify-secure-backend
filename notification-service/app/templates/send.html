{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h2 class="page-title">Broadcast Message</h2>
</div>

<div class="row">
    <div class="col-12">
        <div class="card h-100 border-crisp bg-black">
            <div class="card-header border-bottom border-dark text-uppercase small text-secondary fw-bold"
                style="letter-spacing: 1px;">
                New Notification
            </div>
            <div class="card-body p-5">
                <form method="POST">
                    <div class="mb-5">
                        <label class="form-label text-secondary mb-2">Target Audience</label>
                        <select class="form-select bg-dark border-dark text-white py-3" name="target">
                            <option value="test">Test Device Only</option>
                            <option value="all">Global Broadcast (Topic: 'all')</option>
                        </select>
                        <div class="form-text text-secondary mt-2">Select who should receive this push notification.
                        </div>
                    </div>

                    <div class="mb-5">
                        <label class="form-label text-secondary mb-2">Title</label>
                        <input type="text" class="form-control bg-dark border-dark text-white py-3" name="title"
                            required placeholder="e.g. Market Alert: BTC/USD">
                    </div>

                    <div class="mb-5">
                        <label class="form-label text-secondary mb-2">Message Body</label>
                        <textarea class="form-control bg-dark border-dark text-white py-3" name="body" rows="6" required
                            placeholder="Type your message here..."></textarea>
                    </div>

                    <div class="d-flex justify-content-end">
                        <button type="submit" class="btn btn-primary bg-white text-black border-0 fw-bold px-4 py-2">
                            <i class="bi bi-cursor-fill me-2"></i> Send Broadcast
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
